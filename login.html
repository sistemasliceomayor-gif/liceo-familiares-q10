<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acceso funcionarios — Familiares Q10 2027</title>
<link rel="icon" href="assets/escudo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css">
<style>
  body{min-height:100svh;background:var(--verde-900);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .card{width:100%;max-width:380px;background:var(--crema);border-radius:18px;padding:30px 26px;box-shadow:0 20px 46px rgba(0,0,0,.35);text-align:center;}
  .card img{width:84px;height:84px;margin-bottom:12px;}
  h1{font-size:19px;margin:0 0 4px;}
  .card p{font-size:13.5px;color:var(--tinta-suave);margin:0 0 18px;}
  form{text-align:left;}
  .cta{margin-top:20px;}
  .copyright{color:rgba(255,255,255,.45);}
</style>
</head>
<body>
<div class="card">
  <img src="assets/escudo.png" alt="Escudo">
  <h1>Acceso de funcionarios</h1>
  <p>Actualización de familiares Q10 — solo personal autorizado.</p>
  <form id="loginForm">
    <label for="area">Área</label>
    <select id="area" required>
      <option value="" disabled selected>Seleccione…</option>
      <option value="admin">Administración</option>
      <option value="secretaria">Secretaría Académica</option>
      <option value="coordinaciones">Coordinaciones</option>
      <option value="docentes">Docentes</option>
    </select>
    <label for="clave">Clave de acceso</label>
    <input type="password" id="clave" required autocomplete="off">
    <div class="alerta oculto" id="err" role="alert"></div>
    <button class="cta" type="submit">Ingresar</button>
  </form>
</div>
<p class="copyright">© 2026 Desarrollado por el Departamento de Sistemas — I.E. Liceo Mayor de Soledad "Rafael U. Lafaurie Rivera".</p>

<script src="config.js"></script>
<script>
// Las claves se verifican en el servidor (Apps Script). Esta página no contiene ninguna clave.
const form = document.getElementById("loginForm"), err = document.getElementById("err"), btn = form.querySelector("button");
form.addEventListener("submit", async e => {
  e.preventDefault();
  err.classList.add("oculto");
  const area = document.getElementById("area").value, clave = document.getElementById("clave").value;
  if (!area || !clave) { err.textContent = "Seleccione el área y escriba la clave."; err.classList.remove("oculto"); return; }
  btn.disabled = true; btn.textContent = "Verificando…";
  try {
    const r = await api("login", { area, clave });
    sessionStorage.setItem("fq10_token", r.token);
    location.href = "panel.html";
  } catch (ex) {
    err.textContent = ex.message; err.classList.remove("oculto");
    document.getElementById("clave").value = ""; document.getElementById("clave").focus();
  } finally { btn.disabled = false; btn.textContent = "Ingresar"; }
});
</script>
</body>
</html>
